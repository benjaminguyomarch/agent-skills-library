name: SEO Audit post-déploiement

on:
  workflow_dispatch:
    inputs:
      deploy_url:
        description: "URL du site à auditer"
        required: true
  # Appeler ce workflow depuis votre workflow de déploiement :
  # uses: ./.github/workflows/seo-audit.yml
  # with:
  #   deploy_url: https://monsite.com

jobs:
  seo-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install audit tools
        run: |
          npm install -g @lhci/cli@latest
          npm install -g pa11y@latest

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Run SEO Audit
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PAGESPEED_API_KEY: ${{ secrets.PAGESPEED_API_KEY }}
          AUDIT_BASE_URL: ${{ inputs.deploy_url || vars.DEPLOY_URL }}
        run: |
          claude --print "Audit SEO post-déploiement pour $AUDIT_BASE_URL"

      - name: Upload rapport SEO
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-seo-${{ github.run_number }}
          path: rapport-seo/
          retention-days: 90

      - name: Commit latest.md
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rapport-seo/latest.md
          git diff --cached --quiet || git commit -m "chore: update seo audit report"
          git push
